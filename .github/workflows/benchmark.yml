name: Benchmark Natural Writer

on:
  workflow_dispatch:
    inputs:
      benchmark_limit:
        description: "Numero di testi campione da eseguire"
        required: false
        default: "2"
      model:
        description: "Modello Gemini"
        required: false
        default: "gemini-3.5-flash-lite"
  push:
    paths:
      - ".github/workflows/benchmark.yml"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || 'gemini-3.5-flash-lite' }}
          BENCHMARK_LIMIT: ${{ inputs.benchmark_limit || '2' }}
        run: npm run benchmark

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: natural-writer-benchmark
          path: benchmark-results/
          if-no-files-found: warn
          retention-days: 14
